name: metadata engine startup

on:
  push:
    branches:
      - main
      - "release-**"
    paths:
      - .github/scripts/start_meta_engine.sh
      - .github/workflows/meta-engine-startup.yml
  pull_request:
    paths:
      - .github/scripts/start_meta_engine.sh
      - .github/workflows/meta-engine-startup.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  mysql:
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Start MySQL metadata engine
        run: |
          source .github/scripts/start_meta_engine.sh
          start_meta_engine mysql

      - name: Start MySQL object storage
        run: |
          sudo systemctl stop mysql.service
          source .github/scripts/start_meta_engine.sh
          start_meta_engine sqlite3 mysql
