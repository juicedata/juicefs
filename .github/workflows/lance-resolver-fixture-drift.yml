name: "lance-resolver fixture drift"

on:
  push:
    branches:
      - 'main'
      - 'release-**'
    paths:
      - 'tools/lance-resolver/**'
      - '**/lance-resolver-fixture-drift.yml'
  pull_request:
    branches:
      - 'main'
      - 'release-**'
    paths:
      - 'tools/lance-resolver/**'
      - '**/lance-resolver-fixture-drift.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fixture-drift:
    timeout-minutes: 15
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version-file: go.mod
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Lance writer
        run: pip install pylance==10.0.0
      - name: Check fixture drift
        run: bash tools/lance-resolver/scripts/check-fixture-drift.sh
      - name: Build resolver for range verification
        run: go build -o "${RUNNER_TEMP}/lance-resolver" ./tools/lance-resolver
      - name: Verify warmup range sufficiency (adversarial)
        env:
          LANCE_RESOLVER_BIN: ${{ runner.temp }}/lance-resolver
        run: |
          python tools/lance-resolver/scripts/verify_warmup_ranges.py tools/lance-resolver/testdata/lance-dataset id
          python tools/lance-resolver/scripts/verify_warmup_ranges.py tools/lance-resolver/testdata/lance-dataset tags
          python tools/lance-resolver/scripts/verify_warmup_ranges.py tools/lance-resolver/testdata/lance-dataset addr
          python tools/lance-resolver/scripts/verify_warmup_ranges.py tools/lance-resolver/testdata/lance-dataset id,name,addr,tags
          python tools/lance-resolver/scripts/verify_warmup_ranges.py --multi-base
      - name: Golden tests
        run: go test ./tools/lance-resolver/...
