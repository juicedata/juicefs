name: FUSE stale mount diagnosis

on:
  pull_request:
    paths:
      - '.github/workflows/fuse-stale-mount.yml'
      - '.github/scripts/fuse_stale_mount.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Compare stale mount cleanup paths
        shell: bash
        run: |
          sudo modprobe fuse
          sudo python3 -u .github/scripts/fuse_stale_mount.py | tee fuse-stale-mount.log

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuse-stale-mount-${{ matrix.os }}
          path: fuse-stale-mount.log
